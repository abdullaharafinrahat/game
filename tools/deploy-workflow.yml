# GitHub Pages deploy workflow.
#
# This is a TEMPLATE rather than a live workflow on purpose: pushing a file to
# .github/workflows/ requires a token with the `workflow` scope. Copy it there
# once you have one:
#
#   mkdir -p .github/workflows && cp tools/deploy-workflow.yml .github/workflows/deploy.yml
#
# It builds the optimized assets from the crass repo on every deploy, validates
# them, then builds and publishes dist/ to Pages.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pulls the source pack from the crass repo (Git LFS pointers are served
      # as real bytes by media.githubusercontent.com) and optimizes it. Runs on
      # every deploy so the deployed game always matches the pipeline output.
      - name: Build game assets
        run: npm run assets

      - name: Validate assets
        run: npm run assets:check

      - name: Typecheck and build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
